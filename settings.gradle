pluginManagement {
    repositories {
        // maven.google.com 在部分网络下不通，直接指向它的实际后端
        maven { url 'https://dl.google.com/dl/android/maven2/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        maven { url 'https://dl.google.com/dl/android/maven2/' }
        mavenCentral()
    }
}

rootProject.name = 'MoRead'
include ':app'
